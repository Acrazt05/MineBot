[project]
name = "minebot"
version = "0.1.0"
description = "JEPA-based Minecraft BOT"
readme = "README.md"
authors = [
    { name = "Acrazt05", email = "cronotriger03@gmail.com" }
]
requires-python = ">=3.11, <3.14"
dependencies = [
    "minestudio>=1.1.3",
]

[project.scripts]
minebot = "minebot:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
