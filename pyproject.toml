[project]
name = "minebot"
version = "0.1.0"
description = "JEPA-based Minecraft BOT"
readme = "README.md"
authors = [
    { name = "Acrazt05", email = "cronotriger03@gmail.com" }
]
requires-python = ">=3.11, <3.14"
dependencies = [
    "datasets<4.0.0",
    "einops>=0.8.2",
    "gymnasium>=1.4.0",
    "huggingface-hub>=2.4.0",
    "ipywidgets>=8.1.9",
    "minestudio>=1.1.3",
    "numpy>=1.26.4",
    "pyarrow<18.0.0",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
]

[project.scripts]
minebot = "minebot:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
